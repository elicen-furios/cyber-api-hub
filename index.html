 "Category": "Weather", "Link": "https://weathertotals.com/api"}, {"API": "World Time & Weather", "Description": "Current weather, local time, UTC offset and DST rules for 400 cities as static JSON", "Auth": "No", "HTTPS": "Yes", "Category": "Weather", "Link": "https://worldtimeweather.com/api.html"}, {"API": "wttr.in", "Description": "Weather in your terminal, supports JSON output", "Auth": "No", "HTTPS": "Yes", "Category": "Weather", "Link": "https://wttr.in/:help"}, {"API": "Yandex.Weather", "Description": "Assesses weather condition in specific locations", "Auth": "apiKey", "HTTPS": "Yes", "Category": "Weather", "Link": "https://yandex.com/dev/weather/"}];
    const grid = document.getElementById("apiGrid");
    const countBadge = document.getElementById("countBadge");
    const searchInput = document.getElementById("searchInput");

    countBadge.innerText = allApis.length + " APIs";

    function render(list) {
      grid.innerHTML = "";
      if(list.length === 0) {
        grid.innerHTML = "<p style='color:#64748b;grid-column:1/-1;text-align:center;'>No APIs found matching query.</p>";
        return;
      }
      list.forEach(api => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="title">${api.API}</div>
              <div class="cat">${api.Category || "General"}</div>
            </div>
            <div class="desc">${api.Description || "No description available."}</div>
          </div>
          <div>
            <div class="meta">
              <span>🛡 Auth: ${api.Auth || "No"}</span>
              <span>🔒 HTTPS: ${api.HTTPS || "Yes"}</span>
            </div>
            <a href="${api.Link}" target="_blank" class="btn">View Documentation →</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    render(allApis);

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allApis.filter(a => 
        (a.API && a.API.toLowerCase().includes(q)) ||
        (a.Category && a.Category.toLowerCase().includes(q)) ||
        (a.Description && a.Description.toLowerCase().includes(q))
      );
      countBadge.innerText = filtered.length + " APIs";
      render(filtered);
    });
  </script>
