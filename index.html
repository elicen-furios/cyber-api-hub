<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER ACCESS - FREE API WEB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 20%, #0d1527 0%, #030712 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; color: #fff;
    }
    .auth-card {
      width: 100%; max-width: 400px; background: rgba(13, 21, 39, 0.95);
      border: 1px solid #38bdf8; border-radius: 20px; padding: 26px 20px;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.35); text-align: center;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px; color: #38bdf8; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px;
    }
    h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
    p { font-size: 0.78rem; color: #94a3b8; margin-bottom: 20px; }
    .btn-oauth {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04); color: #fff; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; margin-bottom: 10px; transition: 0.2s;
    }
    .btn-oauth:hover { background: rgba(255,255,255,0.08); border-color: #38bdf8; }
    .sep { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: #64748b; font-size: 0.72rem; }
    .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .auth-input {
      width: 100%; background: #030712; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 11px 12px; color: #fff; font-size: 0.85rem; outline: none; margin-bottom: 10px;
    }
    .btn-submit {
      width: 100%; background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 0.88rem;
      font-weight: 700; cursor: pointer;
    }
    .tag-limit { font-size: 0.72rem; color: #38bdf8; margin-top: 8px; }
    .tag-err { font-size: 0.72rem; color: #f43f5e; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="auth-card" id="loginBox">
    <div class="badge"><i class="fa-solid fa-shield-halved"></i> Z+ Security Protocol</div>
    <h2>CYBER ACCESS</h2>
    <p>Sign in to verify your identity</p>

    <button class="btn-oauth" onclick="loginGoogle()">
      <i class="fa-brands fa-google" style="color:#ea4335;"></i> Sign in with Google
    </button>
    <button class="btn-oauth" onclick="loginGithub()">
      <i class="fa-brands fa-github"></i> Sign in with GitHub
    </button>

    <div class="sep">OR PHONE OTP</div>

    <input type="tel" id="userPhone" class="auth-input" placeholder="+91 9876543210">
    <div id="recaptcha-anchor"></div>
    <button class="btn-submit" id="btnSendOtp" onclick="sendOtp()">Send OTP</button>

    <div id="otpInputBox" style="display:none; margin-top:10px;">
      <input type="text" id="userOtp" class="auth-input" placeholder="Enter 6-digit OTP">
      <button class="btn-submit" onclick="verifyOtp()">Verify Code</button>
    </div>

    <div class="tag-limit" id="quotaStatus">Rate Limit: Max 5 OTPs / day</div>
    <div class="tag-err" id="errBox"></div>
  </div>

  <div id="welcomeBox" style="display:none; text-align:center;">
    <h2 id="welcomeMsg" style="margin-bottom:12px;">Access Granted</h2>
    <button class="btn-submit" style="max-width:200px; margin:auto;" onclick="logout()">Logout</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBt_zPZndgJh82AK8tXWvOyN8ec3dY31KQ",
      authDomain: "free-api-web-2a7bc.firebaseapp.com",
      projectId: "free-api-web-2a7bc",
      storageBucket: "free-api-web-2a7bc.firebasestorage.app",
      messagingSenderId: "118488816924",
      appId: "1:118488816924:web:f4a86246ed76778f00eed9",
      measurementId: "G-2PG8X0PK0R"
    };

    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("welcomeBox").style.display = "block";
        const name = user.displayName || user.phoneNumber || user.email || "Verified Member";
        document.getElementById("welcomeMsg").innerText = "Welcome, " + name;
      } else {
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("welcomeBox").style.display = "none";
      }
    });

    function getQuota() {
      const today = new Date().toISOString().slice(0, 10);
      let q = JSON.parse(localStorage.getItem("otp_limit_tracker") || "{}");
      if (q.date !== today) q = { date: today, count: 0 };
      return q;
    }

    function sendOtp() {
      const q = getQuota();
      const err = document.getElementById("errBox");
      err.innerText = "";

      if (q.count >= 5) {
        err.innerText = "Daily Limit Reached: Only 5 OTP requests allowed per day.";
        return;
      }

      const phone = document.getElementById("userPhone").value.trim();
      if (!phone || phone.length < 10) {
        err.innerText = "Please enter phone number with country code (+91)";
        return;
      }

      if (!window.recaptchaVerifier) {
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier("recaptcha-anchor", { size: "invisible" });
      }

      firebase.auth().signInWithPhoneNumber(phone, window.recaptchaVerifier)
        .then(conf => {
          window.confResult = conf;
          q.count += 1;
          localStorage.setItem("otp_limit_tracker", JSON.stringify(q));
          document.getElementById("btnSendOtp").style.display = "none";
          document.getElementById("otpInputBox").style.display = "block";
          document.getElementById("quotaStatus").innerText = "Requests left today: " + (5 - q.count);
          alert("OTP sent successfully!");
        }).catch(e => { err.innerText = e.message; });
    }

    function verifyOtp() {
      const code = document.getElementById("userOtp").value.trim();
      if (!code || !window.confResult) return;
      window.confResult.confirm(code)
        .catch(e => { document.getElementById("errBox").innerText = "Invalid OTP: " + e.message; });
    }

    function loginGoogle() {
      firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(e => alert(e.message));
    }

    function loginGithub() {
      firebase.auth().signInWithPopup(new firebase.auth.GithubAuthProvider())
        .catch(e => alert(e.message));
    }

    function logout() {
      firebase.auth().signOut();
    }
  </script>
</body>
</html>
