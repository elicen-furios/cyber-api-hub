<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER HUB // PUBLIC APIS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #0e131f;
      --card-border: #1e293b;
      --neon-cyan: #00f2fe;
      --neon-green: #10b981;
      --neon-purple: #8b5cf6;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display:flex; flex-direction:column; }
    
    header {
      background: rgba(14, 19, 31, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top:0; z-index: 100;
    }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; color:#fff; letter-spacing:1px; }
    .brand span { color: var(--neon-cyan); font-family: 'Fira Code', monospace; }
    
    .music-bar {
      background: var(--card-bg);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .play-btn {
      background: var(--neon-cyan);
      border: none;
      color: #000;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    .wave { display:flex; gap:3px; align-items:flex-end; height:18px; }
    .wave-line { width:3px; background:var(--neon-cyan); height:4px; border-radius:2px; transition: height 0.2s; }
    .playing .wave-line { animation: bounce 0.6s infinite alternate; }
    .playing .wave-line:nth-child(2) { animation-delay: 0.15s; }
    .playing .wave-line:nth-child(3) { animation-delay: 0.3s; }
    .playing .wave-line:nth-child(4) { animation-delay: 0.45s; }
    @keyframes bounce { 0% { height:4px; } 100% { height:18px; } }

    .main { flex:1; padding: 24px 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .hero { text-align:center; margin-bottom: 24px; }
    .hero h1 { font-size: 28px; font-weight:800; margin-bottom:8px; font-family:'Fira Code', monospace; color:#fff; }
    .hero h1 b { color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0,242,254,0.4); }
    .hero p { color: var(--muted); font-size:13px; }

    .search-wrap {
      display: flex;
      gap: 10px;
      margin: 20px auto;
      max-width: 600px;
    }
    .search-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 8px;
      color: #fff;
      outline: none;
      font-size: 14px;
    }
    .search-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 242, 254, 0.3); }

    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .pill.active, .pill:hover { background: rgba(0, 242, 254, 0.1); border-color: var(--neon-cyan); color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--neon-cyan); }
    .card h3 { font-size: 15px; margin-bottom: 6px; color:#fff; display:flex; justify-content:space-between; align-items:center; }
    .card p { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag { font-size: 10px; font-family:'Fira Code', monospace; padding: 2px 6px; border-radius: 4px; background: #162033; color: var(--neon-cyan); }
    .btn-link {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-link:hover { background: var(--neon-cyan); color: #000; }
    
    footer { text-align:center; padding: 18px; border-top: 1px solid var(--card-border); font-size: 11px; color: var(--muted); font-family:'Fira Code', monospace; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>[&gt;_]</span> AKHIL // API_GRID
    </div>
    <div class="music-bar">
      <div class="wave" id="wave">
        <div class="wave-line"></div>
        <div class="wave-line"></div>
        <div class="wave-line"></div>
        <div class="wave-line"></div>
      </div>
      <button class="play-btn" id="playBtn" onclick="toggleAudio()"><i class="fa-solid fa-play" id="playIcon"></i></button>
    </div>
  </header>

  <main class="main">
    <div class="hero">
      <h1>PUBLIC <b>APIs</b> TERMINAL</h1>
      <p>Live synchronized from public-apis/public-apis repository</p>
    </div>

    <div class="search-wrap">
      <input type="text" class="search-input" id="searchBox" placeholder="Search API by name or description...">
    </div>

    <div class="category-pills" id="categoryBox">
      <button class="pill active" onclick="filterCat('All')">All</button>
      <button class="pill" onclick="filterCat('Anime')">Anime</button>
      <button class="pill" onclick="filterCat('Music')">Music</button>
      <button class="pill" onclick="filterCat('Weather')">Weather</button>
      <button class="pill" onclick="filterCat('Games & Comics')">Games</button>
      <button class="pill" onclick="filterCat('Cryptocurrency')">Crypto</button>
      <button class="pill" onclick="filterCat('Development')">Dev</button>
    </div>

    <div class="grid" id="gridBox">
      <div style="grid-column: 1/-1; text-align:center; color:var(--muted); padding:40px;">
        <i class="fa-solid fa-circle-notch fa-spin"></i> Fetching APIs from GitHub...
      </div>
    </div>
  </main>

  <footer>
    INIT PROTOCOL // DEVELOPED BY AKHIL • 2026
  </footer>

  <audio id="bgAudio" loop src="https://actions.google.com/sounds/v1/science_fiction/scifi_hum_loop.ogg"></audio>

  <script>
    let allApis = [];
    const grid = document.getElementById('gridBox');
    const searchBox = document.getElementById('searchBox');
    const audio = document.getElementById('bgAudio');
    const playIcon = document.getElementById('playIcon');
    const wave = document.getElementById('wave');

    // 1. Music Player Control
    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
        wave.classList.add('playing');
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
        wave.classList.remove('playing');
      }
    }

    // 2. Fetch Real APIs from public-apis GitHub data source
    async function loadApis() {
      try {
        const res = await fetch("./apis.json");
        // Fallback backup endpoint if first fails
        let data = [];
        if (res.ok) {
          const catList = await res.json();
          // load first batch
          const apiRes = await fetch("./apis.json");
          data = await apiRes.json();
        } else {
          throw new Error();
        }

        allApis = data.map(item => ({
          API: item.name || item.API,
          Description: item.description || item.Description,
          Category: item.category || item.Category || 'General',
          Link: item.url || item.Link,
          Auth: item.auth || 'No'
        }));

        render(allApis);
      } catch (err) {
        // Fallback local list agar internet slow ho
        allApis = [
          { API: "Jikan", Description: "Unofficial MyAnimeList REST API for anime and manga data.", Category: "Anime", Link: "https://jikan.moe/", Auth: "No" },
          { API: "OpenWeatherMap", Description: "Simple and fast weather forecasts and current weather data.", Category: "Weather", Link: "https://openweathermap.org/api", Auth: "apiKey" },
          { API: "Spotify", Description: "Play music, fetch albums, artists, tracks and playlists metadata.", Category: "Music", Link: "https://developer.spotify.com/", Auth: "OAuth" },
          { API: "CoinGecko", Description: "Crypto market data, prices, charts and trading volumes.", Category: "Cryptocurrency", Link: "https://www.coingecko.com/api", Auth: "No" },
          { API: "Pokéapi", Description: "All the Pokémon data you'll ever need in one place.", Category: "Games & Comics", Link: "https://pokeapi.co/", Auth: "No" },
          { API: "GitHub REST API", Description: "Interact with GitHub repositories, issues, users and workflows.", Category: "Development", Link: "https://docs.github.com/rest", Auth: "OAuth" }
        ];
        render(allApis);
      }
    }

    function render(list) {
      if(!list.length) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:var(--muted); padding:30px;">No APIs found matching query.</div>';
        return;
      }
      grid.innerHTML = list.slice(0, 60).map(item => `
        <div class="card">
          <div>
            <h3>${item.API} <span class="tag">${item.Category}</span></h3>
            <p>${item.Description}</p>
          </div>
          <div>
            <div class="tags">
              <span class="tag"><i class="fa-solid fa-shield-halved"></i> Auth: ${item.Auth || 'None'}</span>
              <span class="tag"><i class="fa-solid fa-lock"></i> HTTPS</span>
            </div>
            <a href="${item.Link}" target="_blank" class="btn-link">View Documentation &rarr;</a>
          </div>
        </div>
      `).join('');
    }

    // 3. Search and Filters
    searchBox.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allApis.filter(x => 
        (x.API && x.API.toLowerCase().includes(q)) || 
        (x.Description && x.Description.toLowerCase().includes(q))
      );
      render(filtered);
    });

    function filterCat(cat) {
      document.querySelectorAll('.pill').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'All') {
        render(allApis);
      } else {
        const filtered = allApis.filter(x => x.Category && x.Category.toLowerCase().includes(cat.toLowerCase()));
        render(filtered);
      }
    }

    loadApis();
  </script>
</body>
</html>
