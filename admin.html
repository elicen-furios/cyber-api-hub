<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber API Hub | Root Admin Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="apis.js?v=build_1950_final"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:#030712; color:#f8fafc; min-height:100vh; padding:24px 16px; }
    .admin-container { max-width:900px; margin:0 auto; }
    
    .admin-header {
      display:flex; justify-content:space-between; align-items:center;
      background:rgba(15,23,42,0.8); border:1px solid rgba(244,63,94,0.4);
      padding:18px 24px; border-radius:16px; box-shadow:0 0 30px rgba(244,63,94,0.15);
      margin-bottom:24px;
    }
    .badge { background:#f43f5e; color:#fff; font-size:0.75rem; font-weight:800; padding:4px 10px; border-radius:6px; letter-spacing:1px; }
    .back-btn { background:rgba(255,255,255,0.08); color:#cbd5e1; border:1px solid rgba(255,255,255,0.15); padding:8px 16px; border-radius:8px; text-decoration:none; font-size:0.85rem; font-weight:600; }
    .back-btn:hover { background:rgba(255,255,255,0.15); color:#fff; }

    .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin-bottom:24px; }
    .stat-box { background:#0a1120; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:18px; text-align:center; }
    .stat-box span { font-size:0.8rem; color:#94a3b8; font-weight:600; }
    .stat-box h3 { font-size:1.6rem; color:#00f2fe; margin-top:6px; }

    .card-panel { background:#0a1120; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:22px; margin-bottom:24px; }
    .card-panel h2 { font-size:1.15rem; color:#00f2fe; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .full-width { grid-column:span 2; }
    @media(max-width:600px) { .form-grid { grid-template-columns:1fr; } .full-width { grid-column:span 1; } }

    .input-grp { display:flex; flex-direction:column; gap:6px; }
    .input-grp label { font-size:0.8rem; color:#94a3b8; font-weight:600; }
    .input-grp input, .input-grp select, .input-grp textarea {
      background:#030712; border:1px solid rgba(255,255,255,0.15); border-radius:8px;
      padding:10px 14px; color:#fff; font-size:0.9rem; outline:none;
    }
    .input-grp input:focus, .input-grp textarea:focus { border-color:#00f2fe; }

    .btn-submit {
      background:linear-gradient(135deg, #f43f5e, #be123c); color:#fff; border:none;
      padding:12px 20px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:0.95rem;
      width:100%; margin-top:14px; box-shadow:0 0 20px rgba(244,63,94,0.3);
    }
    .btn-submit:active { transform:scale(0.99); }

    .custom-list { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .custom-item {
      display:flex; justify-content:space-between; align-items:center;
      background:#030712; border:1px solid rgba(255,255,255,0.06); padding:12px 16px; border-radius:10px;
    }
    .btn-del { background:rgba(244,63,94,0.15); color:#f43f5e; border:1px solid #f43f5e; border-radius:6px; padding:6px 12px; cursor:pointer; font-weight:bold; font-size:0.8rem; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="badge">ROOT ADMIN</span>
        <h1 style="font-size:1.25rem; margin:0;">Cyber API Control Center</h1>
      </div>
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> View Live Site</a>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <span>TOTAL APIS IN REPO</span>
        <h3 id="statTotal">--</h3>
      </div>
      <div class="stat-box">
        <span>CUSTOM CREATED APIS</span>
        <h3 id="statCustom" style="color:#f43f5e;">0</h3>
      </div>
      <div class="stat-box">
        <span>STATUS</span>
        <h3 style="color:#10b981; font-size:1.1rem; margin-top:12px;">● LIVE RUNTIME</h3>
      </div>
    </div>

    <!-- Create API Form -->
    <div class="card-panel">
      <h2><i class="fa-solid fa-plus-circle"></i> Add New API To Platform</h2>
      
      <div class="form-grid">
        <div class="input-grp">
          <label>API Name *</label>
          <input type="text" id="admName" placeholder="e.g. WeatherStack Pro">
        </div>
        <div class="input-grp">
          <label>Category *</label>
          <input type="text" id="admCat" placeholder="e.g. Weather, Crypto, AI">
        </div>
        <div class="input-grp full-width">
          <label>API Documentation / Direct URL *</label>
          <input type="text" id="admUrl" placeholder="https://api.example.com/v1">
        </div>
        <div class="input-grp full-width">
          <label>Short Description *</label>
          <textarea id="admDesc" rows="2" placeholder="Accurate real-time global weather endpoint..."></textarea>
        </div>
        <div class="input-grp">
          <label>Authentication</label>
          <select id="admAuth">
            <option value="No Auth">No Auth (Free)</option>
            <option value="apiKey">API Key</option>
            <option value="OAuth">OAuth 2.0</option>
          </select>
        </div>
        <div class="input-grp">
          <label>CORS Support</label>
          <select id="admCors">
            <option value="Yes">Yes (Browser Friendly)</option>
            <option value="No">No (Server Only)</option>
            <option value="Unknown">Unknown</option>
          </select>
        </div>
      </div>

      <button class="btn-submit" onclick="addApi()"><i class="fa-solid fa-upload"></i> Publish to Live Catalog</button>
    </div>

    <!-- Custom APIs Manager -->
    <div class="card-panel">
      <h2><i class="fa-solid fa-list-check"></i> Custom Added APIs</h2>
      <div id="customList" class="custom-list">
        <p style="color:#64748b; font-size:0.85rem;">No custom APIs added yet.</p>
      </div>
    </div>
  </div>

  <script>
    function getStoredCustom() {
      try { return JSON.parse(localStorage.getItem("CYBER_CUSTOM_APIS") || "[]"); }
      catch(e) { return []; }
    }

    function refreshView() {
      const custom = getStoredCustom();
      const totalCount = (window.PUBLIC_APIS_DATABASE ? window.PUBLIC_APIS_DATABASE.length : 1950) + custom.length;
      document.getElementById("statTotal").innerText = totalCount.toLocaleString();
      document.getElementById("statCustom").innerText = custom.length;

      const listEl = document.getElementById("customList");
      if (!custom.length) {
        listEl.innerHTML = '<p style="color:#64748b; font-size:0.85rem;">No custom APIs added yet. Add one above!</p>';
        return;
      }

      listEl.innerHTML = custom.map((item, idx) => `
        <div class="custom-item">
          <div>
            <b style="color:#00f2fe;">${item.API}</b> 
            <span style="font-size:0.75rem; background:rgba(255,255,255,0.08); padding:2px 8px; border-radius:4px; margin-left:6px;">${item.Category}</span>
            <p style="color:#94a3b8; font-size:0.8rem; margin-top:4px;">${item.Description}</p>
          </div>
          <button class="btn-del" onclick="deleteCustom(${idx})"><i class="fa-solid fa-trash"></i> Delete</button>
        </div>
      `).join("");
    }

    function addApi() {
      const name = document.getElementById("admName").value.trim();
      const cat = document.getElementById("admCat").value.trim() || "General";
      const url = document.getElementById("admUrl").value.trim();
      const desc = document.getElementById("admDesc").value.trim();
      const auth = document.getElementById("admAuth").value;
      const cors = document.getElementById("admCors").value;

      if (!name || !url || !desc) {
        alert("Please fill all required fields: Name, URL, Description");
        return;
      }

      const item = { API: name, Category: cat, Link: url, Description: desc, Auth: auth, CORS: cors };
      const current = getStoredCustom();
      current.unshift(item);
      localStorage.setItem("CYBER_CUSTOM_APIS", JSON.stringify(current));

      // Reset
      document.getElementById("admName").value = "";
      document.getElementById("admCat").value = "";
      document.getElementById("admUrl").value = "";
      document.getElementById("admDesc").value = "";

      alert(`✅ API "${name}" successfully published!`);
      refreshView();
    }

    function deleteCustom(index) {
      if (!confirm("Are you sure you want to delete this API?")) return;
      const current = getStoredCustom();
      current.splice(index, 1);
      localStorage.setItem("CYBER_CUSTOM_APIS", JSON.stringify(current));
      refreshView();
    }

    window.onload = refreshView;
  </script>
</body>
</html>
